[package]
name = "memoria"
version = "1.1.0"
description = "a password memory points manager tool."
authors = ["Evanflare"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "memoria_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
lto = true        # 链接时优化，减小体积
opt-level = "z"   # 优先优化体积（或 "s" 平衡）
strip = true      # 移除调试符号
panic = "abort"   # 移除 panic 展开代码
codegen-units = 1 # 允许更多优化

[build-dependencies]
tauri-build = { version = "2", features = ["isolation"] }

[dependencies]
tauri = { version = "2", features = ["isolation"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6.0.0"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
chacha20poly1305 = "0.10.1"
sysdirs = { version = "0.9.4", features = ["android-auto"] }
hex = "0.4.3"
thiserror = "2.0.18"
toml = "1.1.2"
rand = "0.10.1"
rpassword = "7.5.3"
log = "0.4.33"
tauri-plugin-http = "2.5.9"


[dependencies.uuid]
version = "1.23.1"
# Lets you generate random UUIDs
features = ["v4"]

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-android-fs = "28.2.0"
android_logger = "0.15.1"
tauri-plugin-android-package-install = "2.0.1"
futures-util = "0.3"
reqwest = { version = "0.11", features = [
    "stream",
    "json",
    "rustls-tls",
], default-features = false }
tokio = { version = "1", features = ["full"] }
percent-encoding = "2.3.2"
[target.'cfg(target_os = "windows")'.dependencies]
env_logger = "0.11.11"
chrono = { version = "0.4.45", features = ["serde"] }
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
